<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>সব ব্লগ — Sahab's Blogs</title>
  <meta name="description" content="Sahab's Blogs-এর সব লেখা এক জায়গায় — ক্যাটাগরি অনুযায়ী খুঁজুন বা সার্চ করুন।" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Sahab's<span>Blogs</span></a>

      <nav class="nav-links" id="nav-links" aria-label="প্রধান মেনু">
        <a href="index.html">হোম</a>
        <a href="blogs.html" aria-current="page">সব ব্লগ</a>
        <a href="about.html">আমার সম্পর্কে</a>
        <a href="contact.html">যোগাযোগ</a>
      </nav>

      <div class="header-actions">
        <button class="icon-btn theme-toggle" aria-label="থিম পরিবর্তন করুন">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <button class="icon-btn menu-toggle" aria-label="মেনু খুলুন" aria-expanded="false" aria-controls="nav-links">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="section" style="padding-top:44px;">
      <div class="container">
        <div class="section-head">
          <h2>সব ব্লগ</h2>
        </div>

        <div class="filter-bar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <label for="search-input" class="visually-hidden">লেখা খুঁজুন</label>
            <input type="search" id="search-input" placeholder="শিরোনাম দিয়ে খুঁজুন..." />
          </div>
          <div class="filter-pills" id="filter-pills" role="group" aria-label="ক্যাটাগরি ফিল্টার"></div>
        </div>

        <ul class="post-grid" id="post-list"></ul>
        <p class="no-results" id="no-results" hidden>কোনো লেখা খুঁজে পাওয়া যায়নি। অন্য কিছু দিয়ে খোঁজার চেষ্টা করুন।</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-text">&copy; <span data-current-year></span> Sahab's Blogs — সাহাবুল ইসলাম</p>
      <div class="footer-links">
        <a href="about.html">আমার সম্পর্কে</a>
        <a href="contact.html">যোগাযোগ</a>
      </div>
    </div>
  </footer>

  <script src="js/posts.js"></script>
  <script src="js/render-helpers.js"></script>
  <script src="js/main.js"></script>
  <script src="js/blogs.js"></script>
</body>
</html>
